name: React quality checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:deployment
      - run: npm run test:e2e
        env:
          QA_VITE_PORT: 5177
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: local-test-evidence
          path: test-results/
          retention-days: 7
